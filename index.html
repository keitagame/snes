<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>SNES エミュレータ</title>
    <style>
      :root {
        --bg: #dcd8d2;
        --panel: #eceae6;
        --ink: #25222b;
        --muted: #6c6874;
        --line: #b9b4ad;
        --accent: #5b4a9c;
        --on-accent: #fff;
        --screen: #000;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1b1a20;
          --panel: #25232c;
          --ink: #ebe8f2;
          --muted: #9a96a6;
          --line: #3a3745;
          --accent: #a493e8;
          --on-accent: #17142a;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1b1a20;
        --panel: #25232c;
        --ink: #ebe8f2;
        --muted: #9a96a6;
        --line: #3a3745;
        --accent: #a493e8;
        --on-accent: #17142a;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: #000;
        color: var(--ink);
        font:
          15px/1.6 "Hiragino Sans",
          "Hiragino Kaku Gothic ProN",
          "Yu Gothic UI",
          "Noto Sans JP",
          system-ui,
          sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
        container-type: size;
        display: grid;
        place-items: center;
        background: var(--screen);
      }
      canvas {
        display: block;
        width: min(100cqw, 133.333cqh);
        aspect-ratio: 4/3;
        image-rendering: pixelated;
        background: var(--screen);
      }
      #empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage.drag {
        outline: 3px dashed var(--accent);
        outline-offset: -8px;
      }
      button,
      select {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #tp {
        position: fixed;
        inset: 0;
        display: none;
        pointer-events: none;
        z-index: 5;
      }
      #tp.on {
        display: block;
      }
      #tp * {
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #tp b {
        position: absolute;
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #fff;
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.3);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #tp b.p {
        background: rgba(255, 255, 255, 0.4);
      }
      #dpad {
        position: absolute;
        left: max(14px, env(safe-area-inset-left));
        bottom: calc(28px + env(safe-area-inset-bottom));
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.28);
      }
      #dpad::before,
      #dpad::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        pointer-events: none;
      }
      #dpad::before {
        left: 10%;
        right: 10%;
        top: 38%;
        bottom: 38%;
      }
      #dpad::after {
        top: 10%;
        bottom: 10%;
        left: 38%;
        right: 38%;
      }
      #face {
        position: absolute;
        right: max(14px, env(safe-area-inset-right));
        bottom: calc(28px + env(safe-area-inset-bottom));
        width: 150px;
        height: 150px;
        pointer-events: none;
      }
      #face b {
        width: 54px;
        height: 54px;
        border-radius: 50%;
      }
      #face .x {
        left: 48px;
        top: 0;
        background: rgba(58, 111, 196, 0.55);
      }
      #face .y {
        left: 0;
        top: 48px;
        background: rgba(58, 157, 93, 0.55);
      }
      #face .a {
        right: 0;
        top: 48px;
        background: rgba(201, 60, 60, 0.55);
      }
      #face .b {
        left: 48px;
        bottom: 0;
        background: rgba(217, 164, 33, 0.55);
      }
      #face b.p {
        filter: brightness(1.5);
      }
      #tp .sh {
        width: 76px;
        height: 42px;
        border-radius: 10px;
        bottom: calc(196px + env(safe-area-inset-bottom));
      }
      #tp .sh.l {
        left: max(14px, env(safe-area-inset-left));
      }
      #tp .sh.r {
        right: max(14px, env(safe-area-inset-right));
      }
      #ss {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(14px + env(safe-area-inset-bottom));
        display: flex;
        gap: 10px;
        pointer-events: none;
      }
      #ss b {
        position: static;
        width: 76px;
        height: 32px;
        border-radius: 16px;
        font-size: 0.75rem;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 0.88rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #toast.on {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #tp {
          position: fixed;
          inset: 0;
          display: none;
          pointer-events: none;
          z-index: 5;
        }
        #tp.on {
          display: block;
        }
        #tp * {
          pointer-events: auto;
          touch-action: none;
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
        }
        #tp b {
          position: absolute;
          display: grid;
          place-items: center;
          font-weight: 700;
          color: #fff;
          background: rgba(255, 255, 255, 0.16);
          border: 1px solid rgba(255, 255, 255, 0.3);
          text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        #tp b.p {
          background: rgba(255, 255, 255, 0.4);
        }
        #dpad {
          position: absolute;
          left: max(14px, env(safe-area-inset-left));
          bottom: calc(28px + env(safe-area-inset-bottom));
          width: 132px;
          height: 132px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.12);
          border: 1px solid rgba(255, 255, 255, 0.28);
        }
        #dpad::before,
        #dpad::after {
          content: "";
          position: absolute;
          background: rgba(255, 255, 255, 0.2);
          border-radius: 8px;
          pointer-events: none;
        }
        #dpad::before {
          left: 10%;
          right: 10%;
          top: 38%;
          bottom: 38%;
        }
        #dpad::after {
          top: 10%;
          bottom: 10%;
          left: 38%;
          right: 38%;
        }
        #face {
          position: absolute;
          right: max(14px, env(safe-area-inset-right));
          bottom: calc(28px + env(safe-area-inset-bottom));
          width: 150px;
          height: 150px;
          pointer-events: none;
        }
        #face b {
          width: 54px;
          height: 54px;
          border-radius: 50%;
        }
        #face .x {
          left: 48px;
          top: 0;
          background: rgba(58, 111, 196, 0.55);
        }
        #face .y {
          left: 0;
          top: 48px;
          background: rgba(58, 157, 93, 0.55);
        }
        #face .a {
          right: 0;
          top: 48px;
          background: rgba(201, 60, 60, 0.55);
        }
        #face .b {
          left: 48px;
          bottom: 0;
          background: rgba(217, 164, 33, 0.55);
        }
        #face b.p {
          filter: brightness(1.5);
        }
        #tp .sh {
          width: 76px;
          height: 42px;
          border-radius: 10px;
          bottom: calc(196px + env(safe-area-inset-bottom));
        }
        #tp .sh.l {
          left: max(14px, env(safe-area-inset-left));
        }
        #tp .sh.r {
          right: max(14px, env(safe-area-inset-right));
        }
        #ss {
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          bottom: calc(14px + env(safe-area-inset-bottom));
          display: flex;
          gap: 10px;
          pointer-events: none;
        }
        #ss b {
          position: static;
          width: 76px;
          height: 32px;
          border-radius: 16px;
          font-size: 0.75rem;
        }
        #toast {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="status" hidden></div>
      <div id="stage">
        <canvas id="cv" width="256" height="224" aria-label="ゲーム画面"></canvas>
        <div id="empty"><button class="primary" id="pick2" disabled>ROMを開く</button></div>
      </div>
    </main>
    <div id="toast" role="status"></div>
    <div id="tp" aria-hidden="true">
      <div id="dpad"></div>
      <div id="face">
        <b class="x" data-b="X">X</b><b class="y" data-b="Y">Y</b><b class="a" data-b="A">A</b
        ><b class="b" data-b="B">B</b>
      </div>
      <b class="sh l" data-b="L">L</b><b class="sh r" data-b="R">R</b>
      <div id="ss"><b data-b="SELECT">Select</b><b data-b="START">Start</b></div>
    </div>
    <input type="file" id="file" hidden />

            h;
          if (mode === "auto") {
            if (++detectTick % 20 === 0) {
              var d = detect(new Uint32Array(M.HEAPU8.buffer, p, 512 * 448)),
                k = d.w + "x" + d.h;
              if (k === cand) {
                candN++;
              } else {
                cand = k;
                candN = 1;
              }
              if (candN >= 3) size = d;
            }
            w = size.w;
            h = size.h;
          } else if (mode === "hi") {
            w = 512;
            h = 448;
          } else {
            w = 256;
            h = +mode;
          }
          if (cv.width !== w || cv.height !== h) {
            cv.width = w;
            cv.height = h;
          }
          var img = new ImageData(
            new Uint8ClampedArray(M.HEAPU8.buffer, p, 512 * 448 * 4),
            512,
            448,
          );
          cx.putImageData(img, 0, 0, 0, 0, w, h);
        }

        function step() {
          M._setJoypadInput(pollPad());
          M._mainLoop();
          var sp = M._getSoundBuffer();
          if (M.HEAP32[97024 >> 2] === 0) pushAudio(sp);
        }
        function tick(t) {
          requestAnimationFrame(tick);
          if (!running || paused) {
            last = t;
            return;
          }
          acc += Math.min(t - last, 100);
          last = t;
          var n = 0;
          while (acc >= FRAME && n < 3) {
            step();
            acc -= FRAME;
            n++;
            frames++;
          }
          if (acc > FRAME * 3) acc = 0;
          if (n) draw();
          if (t - fpsT >= 1000) {
            status(romName + "　" + frames + " fps");
            frames = 0;
            fpsT = t;
          }
        }

        function persistSram() {
          if (!running) return;
          var old = M._getSaveSram();
          if (old) M._my_free(old);
          M._saveSramRequest();
          var n = M._getSaveSramSize(),
            p = M._getSaveSram();
          if (!n || !p) return;
          var u = M.HEAPU8.slice(p, p + n),
            any = false;
          for (var i = 0; i < n; i++)
            if (u[i]) {
              any = true;
              break;
            }
          if (!any) return;
          var s = b64enc(u);
          if (s !== lastSram && store.set("snes:sram:" + romName, s)) lastSram = s;
        }
        function restoreSram() {
          var s = store.get("snes:sram:" + romName);
          if (!s) {
            lastSram = "";
            return;
          }
          try {
            var u = b64dec(s),
              p = M._my_malloc(u.length);
            M.HEAPU8.set(u, p);
            M._loadSram(u.length, p);
            M._my_free(p);
            lastSram = s;
          } catch (e) {}
        }
        function boot() {
          M._startWithRom(romPtr, romLen, 0);
          restoreSram();
          acc = 0;
          nextT = 0;
          size = { w: 256, h: 224 };
          cand = "";
          candN = 0;
        }
        async function openRom(file) {
          var u = new Uint8Array(await file.arrayBuffer());
          if (u.length % 1024 === 512) u = u.subarray(512);
          if (u.length < 0x8000) {
            toast("SNESのROMとして読み込めませんでした");
            return;
          }
          persistSram();
          initAudio();
          var p = M._my_malloc(u.length);
          M.HEAPU8.set(u, p);
          var prev = romPtr;
          romPtr = p;
          romLen = u.length;
          romName = file.name.replace(/\.[^.]+$/, "");
          boot();
          if (prev) M._my_free(prev);
          running = true;
          paused = false;
          $("empty").style.display = "none";
          document.title = romName + " - SNES エミュレータ";
          last = performance.now();
          fpsT = last;
          frames = 0;
        }

        function saveState() {
          if (!running) return;
          var p = M._saveState();
          if (!p) {
            toast("ステートを保存できませんでした");
            return;
          }
          var u = M.HEAPU8.slice(p, p + M._getStateSaveSize());
          M._my_free(p);
          toast(
            store.set("snes:state:" + romName, b64enc(u))
              ? "ステートをセーブしました"
              : "ブラウザの保存容量が足りません",
          );
        }
        function loadState() {
          if (!running) return;
          var s = store.get("snes:state:" + romName);
          if (!s) {
            toast("セーブしたステートがありません");
            return;
          }
          var u = b64dec(s),
            p = M._my_malloc(u.length);
          M.HEAPU8.set(u, p);
          var ok = M._loadState(p, u.length);
          M._my_free(p);
          toast(ok ? "ステートをロードしました" : "ステートをロードできませんでした");
        }
        function togglePause() {
          if (!running) return;
          paused = !paused;
          if (paused) {
            status(romName + "　一時停止中");
            persistSram();
          } else {
            last = performance.now();
          }
        }

        $("pick2").onclick = function () {
          $("file").click();
        };
        $("file").onchange = function (e) {
          var f = e.target.files[0];
          e.target.value = "";
          if (f) openRom(f);
        };
        function resetGame() {
          if (running) {
            persistSram();
            boot();
            toast("リセットしました");
          }
        }
        function setVol(d) {
          vol = Math.max(0, Math.min(1, Math.round((vol + d) * 20) / 20));
          if (gain) gain.gain.value = vol;
          toast("音量 " + Math.round(vol * 100) + "%");
        }
        function fullscreen() {
          if (document.fullscreenElement) document.exitFullscreen();
          else if (stage.requestFullscreen) stage.requestFullscreen();
        }
        ["dragenter", "dragover"].forEach(function (n) {
          window.addEventListener(n, function (e) {
            e.preventDefault();
            stage.classList.add("drag");
          });
        });
        ["dragleave", "drop"].forEach(function (n) {
          window.addEventListener(n, function (e) {
            e.preventDefault();
            stage.classList.remove("drag");
          });
        });
        window.addEventListener("drop", function (e) {
          var f = e.dataTransfer && e.dataTransfer.files[0];
          if (f) openRom(f);
        });
        window.addEventListener("keydown", function (e) {
          if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
          if (KEYS[e.code]) {
            held |= KEYS[e.code];
            e.preventDefault();
          } else if (e.code === "Digit1" && !e.repeat) saveState();
          else if (e.code === "Digit2" && !e.repeat) loadState();
          else if (e.repeat) return;
          else if (e.code === "KeyP") togglePause();
          else if (e.code === "KeyO") $("file").click();
          else if (e.code === "KeyR") resetGame();
          else if (e.code === "KeyF") fullscreen();
          else if (e.code === "Minus") setVol(-0.1);
          else if (e.code === "Equal") setVol(0.1);
        });
        window.addEventListener("keyup", function (e) {
          if (KEYS[e.code]) {
            held &= ~KEYS[e.code];
            e.preventDefault();
          }
        });
        window.addEventListener("blur", function () {
          held = 0;
        });
        window.addEventListener("pointerdown", function () {
          if (actx && actx.state !== "running") actx.resume();
        });
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            persistSram();
            if (running && !paused) {
              togglePause();
              autoPaused = true;
            }
          } else if (autoPaused) {
            autoPaused = false;
            if (paused) togglePause();
          }
        });
        window.addEventListener("pagehide", persistSram);
        setInterval(function () {
          if (running && !paused) persistSram();
        }, 5000);

        var tp = $("tp");
        function recalc() {
          var m = 0,
            on = {},
            id,
            o,
            el,
            r,
            dx,
            dy;
          for (id in ptrs) {
            o = ptrs[id];
            el = o.el;
            if (el.id === "dpad") {
              r = el.getBoundingClientRect();
              dx = (o.x - r.left - r.width / 2) / (r.width / 2);
              dy = (o.y - r.top - r.height / 2) / (r.height / 2);
              if (dx < -0.3) m |= MASK.LEFT;
              if (dx > 0.3) m |= MASK.RIGHT;
              if (dy < -0.3) m |= MASK.UP;
              if (dy > 0.3) m |= MASK.DOWN;
            } else {
              m |= MASK[el.dataset.b];
              on[el.dataset.b] = 1;
            }
          }
          touchHeld = m;
          Array.prototype.forEach.call(tp.querySelectorAll("[data-b]"), function (b) {
            b.classList.toggle("p", !!on[b.dataset.b]);
          });
        }
        tp.addEventListener("pointerdown", function (e) {
          var el = e.target.closest("[data-b],#dpad");
          if (!el) return;
          e.preventDefault();
          try {
            el.setPointerCapture(e.pointerId);
          } catch (x) {}
          ptrs[e.pointerId] = { el: el, x: e.clientX, y: e.clientY };
          recalc();
        });
        tp.addEventListener("pointermove", function (e) {
          var o = ptrs[e.pointerId];
          if (o) {
            o.x = e.clientX;
            o.y = e.clientY;
            recalc();
          }
        });
        ["pointerup", "pointercancel"].forEach(function (n) {
          tp.addEventListener(n, function (e) {
            delete ptrs[e.pointerId];
            recalc();
          });
        });
        tp.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });
        // iOS Safari ignores user-scalable=no: block pinch and double-tap zoom explicitly
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
          document.addEventListener(n, function (e) {
            e.preventDefault();
          });
        });
        var lastTouchEnd = 0;
        document.addEventListener(
          "touchend",
          function (e) {
            var now = Date.now();
            if (now - lastTouchEnd < 350 && e.target.tagName !== "BUTTON") e.preventDefault();
            lastTouchEnd = now;
          },
          { passive: false },
        );
        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1) e.preventDefault();
          },
          { passive: false },
        );
        window.addEventListener(
          "pointerdown",
          function (e) {
            if (e.pointerType === "touch") tp.classList.add("on");
          },
          true,
        );
        window.addEventListener(
          "keydown",
          function () {
            tp.classList.remove("on");
          },
          true,
        );
        function ready() {
          status("ROMを読み込んでください");
          $("pick2").disabled = false;
          requestAnimationFrame(tick);
        }
        if (window.coreReady) ready();
        else window.onCore = ready;
      })();
    </script>
  </body>
</html>
